<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ismail Elegance — Quiet luxury, made in Pakistan</title>
    <meta name="description" content="Ismail Elegance is a Lahore atelier for hand-embroidered lawn, luxe pret, formals and bridal. Small runs, real hands, free alterations." />
    <meta name="theme-color" content="#17140f" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div id="announcement" class="announcement"></div>
    <header id="site-header" class="header"></header>
    <div id="mobile-nav" class="mobile-nav" aria-hidden="true"></div>
    <main id="app" tabindex="-1"></main>
    <footer id="site-footer" class="footer"></footer>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="cart-drawer" class="drawer" aria-hidden="true" aria-label="Shopping bag"></aside>
    <div id="search-root"></div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <noscript>
      <div style="padding: 4rem; text-align: center; font-family: Georgia, serif">
        Ismail Elegance needs JavaScript enabled to show the collection.
      </div>
    </noscript>
    <!-- Firebase compat CDN for Google Auth (storefront + admin) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
